<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a2744">
    <title>ZiSun</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/loading.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loading Screen -->
<div id="loading-screen" class="loading-screen">
    <!-- بک‌گراند عکس -->
    <div class="loading-bg">
        <img src="assets/loading-bg.webp" alt="">
    </div>

    <div class="loading-content">
        <!-- خورشید دو‌بعدی ساده چرخان -->
        <div class="sun-icon">
            <div class="sun-rays">
                <span class="ray ray-1"></span>
                <span class="ray ray-2"></span>
                <span class="ray ray-3"></span>
                <span class="ray ray-4"></span>
                <span class="ray ray-5"></span>
                <span class="ray ray-6"></span>
                <span class="ray ray-7"></span>
                <span class="ray ray-8"></span>
            </div>
            <div class="sun-core"></div>
        </div>

        <h1 class="brand-name">ZiSun</h1>
        <p class="brand-tagline">made for sunny souls</p>
        <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
    </div>
</div>
    <!-- Main App -->
    <div id="app" class="app-container" style="display:none;"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
